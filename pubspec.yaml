name: hands4events
description: "Plataforma de Gestión de Personal para Eventos"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core
  firebase_core: ^4.9.0

  # UI & Navigation
  url_launcher: ^6.3.1

  # Firebase Services — todos deben actualizarse juntos (mismo FlutterFire major)
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.4.1
  firebase_messaging: ^16.2.2

  # State Management
  provider: ^6.1.2

  # GPS & Location
  geolocator: ^14.0.2
  permission_handler: ^12.0.1

  # Mapa interactivo (OpenStreetMap, sin API key)
  flutter_map: ^8.3.0
  latlong2: ^0.9.1    # No se puede usar ^0.10.x — flutter_map ^8 requiere latlong2 ^0.9.1

  # HTTP (Places API, Translation API)
  http: ^1.2.0

  # Image picker (galería/cámara para avatar y chat)
  image_picker: ^1.1.2

  # PDF generation (tickets de credenciales y nóminas)
  pdf: ^3.11.1
  printing: ^5.13.2

  # Utilities
  intl: ^0.20.2
  path: ^1.9.0

  # Icons
  cupertino_icons: ^1.0.6

  # Notificaciones locales: muestra el heads-up del sistema (estilo WhatsApp) cuando
  # llega un push con la app en primer plano (FCM no lo hace solo en ese caso).
  # Requiere core library desugaring en android/app/build.gradle.kts.
  flutter_local_notifications: ^22.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_hand.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/logo_hand.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
